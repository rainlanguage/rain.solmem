[package]
name = "rain-solmem"
version = "0.1.14"

[profile.default]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000
evm_version = "cancun"

fuzz.runs = 2056
libs = ["dependencies"]

# `test/PackageRequirements.t.sol` reads these to assert that the requirements
# stated in the shipped `README.md` match the config and sources they describe.
fs_permissions = [
  { access = "read", path = "./foundry.toml" },
  { access = "read", path = "./README.md" },
  { access = "read", path = "./src" },
]

[dependencies]
forge-std = "1.16.1"
